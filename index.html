<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F4EE" />
    <link id="app-favicon" rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script>
      (() => {
        const saved = localStorage.getItem('artel-theme')
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#14161c' : '#F7F4EE'
        document.querySelector('#app-favicon').href =
          theme === 'dark' ? '/favicon-dark.svg' : '/favicon.svg'
      })()
    </script>
    <title>ARTEL — 게임 QA를 에이전트가 대신 플레이한다</title>
    <meta
      name="description"
      content="Unity 게임에 SDK를 붙이면 에이전트가 직접 조작하며 시나리오를 검증하고 실패 순간의 증거를 남긴다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ARTEL" />
    <meta property="og:title" content="ARTEL — 게임 QA를 에이전트가 대신 플레이한다" />
    <meta
      property="og:description"
      content="Unity 게임에 SDK를 붙이면 에이전트가 직접 조작하며 시나리오를 검증하고 실패 순간의 증거를 남긴다."
    />
    <!-- hreflang은 절대 URL을 요구한다. 도메인이 정해지면 ARTEL-204에서 넣는다. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
